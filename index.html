<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarea09 - Registro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://jsdelivr.net" />
  </head>
  <body>
    <nav class="navbar bg-dark mb-4" data-bs-theme="dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Sistema de Registro</span>
      </div>
    </nav>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Lista de Datos</h3>
        <button
          type="button"
          class="btn btn-solid theme-primary"
          data-bs-toggle="dialog"
          data-bs-target="#miDialog"
        >
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Operaciones</th>
          </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Dato ejemplo 1</td>
                <td>Detalle del registro 1</td>
                <td>
                    <button type="button" class="btn btn-solid theme-warning btn-sm"><i class="bi bi-pencil"></i></button>
                    <button type="button" class="btn btn-solid theme-danger btn-sm"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>Dato ejemplo 2</td>
                <td>Detalle del registro 2</td>
                <td>
                    <button type="button" class="btn btn-solid theme-warning" btn-sm><i class="bi bi-pencil"></i></button>
                    <button type="button" class="btn btn-solid theme-danger btn-sm"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        </tbody>
      </table>

      <nav>
        <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="$">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
        </ul>
      </nav>
    </div>

    <dialog class="dialog" id="miDialog">
        <div class="dialog-header">
            <h5 class="dialog-title">Registro</h5>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Cerrar"></button>
        </div>
        <div class="dialog-body">
            <div class="mb-3">
                <label class="form-label">Campo 1</label>
                <input type="text" class="form-control" placeholder="Ingrese dato">
            </div>
            <div class="mb-3">
                <label class="form-label">Campo 2</label>
                <input type="text" class="form-control" placeholder="Ingrese dato">
            </div>
            <div class="mb-3">
                <label class="form-label">Campo 3</label>
                <input type="text" class="form-control" placeholder="Ingrese dato">
            </div>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn btn-solid theme-primary" data-bs-dismiss="dialog">OK</button>
        </div>
    </dialog>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
